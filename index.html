<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Factory Lab</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f7fa;
    margin:0;
}

header{
    background:#1f4b99;
    color:white;
    padding:15px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:150px;
    font-family:Consolas, monospace;
    font-size:16px;
}

button{
    padding:10px 20px;
    margin-top:10px;
    cursor:pointer;
}

pre{
    background:#f0f0f0;
    padding:10px;
    border-radius:5px;
}

#result{
    background:#222;
    color:#00ff88;
    padding:10px;
    min-height:60px;
    border-radius:5px;
}

.success{
    color:green;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h2>Python Factory Lab</h2>
</header>

<div class="container">

<div class="card">

<h3>ステージ</h3>

<select id="stage">
    <option value="0">1. Hello World</option>
    <option value="1">2. 名前を表示</option>
    <option value="2">3. 計算してみよう</option>
    <option value="3">4. 変数を使ってみよう</option>
</select>

<h3>ミッション</h3>
<div id="mission"></div>

<h3>お手本</h3>
<pre id="sample"></pre>

<button onclick="copySample()">お手本をコピー</button>

<h3>コード入力</h3>
<textarea id="code"></textarea>

<br>
<button onclick="runCode()">実行</button>

<h3>結果</h3>
<div id="result"></div>

<h3>判定</h3>
<div id="judge"></div>

</div>

</div>

<script>

const stages = [
{
 mission:"Hello Worldを表示してみよう",
 sample:'print("Hello World")',
 answer:"Hello World"
},
{
 mission:"自分の名前を表示してみよう",
 sample:'print("松永さん")',
 answer:"松永さん"
},
{
 mission:"10+20を計算してみよう",
 sample:'print(10+20)',
 answer:"30"
},
{
 mission:"変数を表示してみよう",
 sample:'name = \"Factory\"\\nprint(name)',
 answer:"Factory"
}
];

const stage = document.getElementById("stage");
const mission = document.getElementById("mission");
const sample = document.getElementById("sample");
const code = document.getElementById("code");
const result = document.getElementById("result");
const judge = document.getElementById("judge");

function loadStage() {
    const s = stages[stage.value];

    mission.textContent = s.mission;
    sample.textContent = s.sample;
    code.value = "";
    result.textContent = "";
    judge.textContent = "";
}

function copySample(){
    code.value = sample.textContent;
}

function runCode(){

    const text = code.value;
    const current = stages[stage.value];

    let output = "";

    if(text.includes('print("Hello World")')){
        output = "Hello World";
    }
    else if(text.includes('print("松永さん")')){
        output = "松永さん";
    }
    else if(text.includes('print(10+20)')){
        output = "30";
    }
    else if(text.includes('print(name)')){
        output = "Factory";
    }
    else{
        output = "実行結果を判定できません";
    }

    result.textContent = output;

    if(output === current.answer){
        judge.innerHTML =
            '<div class="success">✅ クリア！</div>';
    }
    else{
        judge.innerHTML =
            '<div>❌ もう一度試してみよう</div>';
    }
}

stage.addEventListener("change", loadStage);

loadStage();

</script>

</body>
</html>
