<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python研修教材</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      color: #eef6ff;
      background: radial-gradient(circle at 70% 10%, #1e3a68, #07111f 45%, #020711);
    }
    main {
      width: min(760px, 100%);
      padding: 40px;
      border: 1px solid #294766;
      border-radius: 22px;
      background: rgba(16, 32, 57, 0.96);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 12px; font-size: 34px; }
    .description { margin: 0 0 30px; color: #b8c7da; line-height: 1.7; }
    .materials { display: grid; gap: 16px; }
    .material {
      display: block;
      padding: 22px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #315273;
      border-radius: 14px;
      background: #142844;
      transition: transform .2s, border-color .2s, background .2s;
    }
    .material:hover, .material:focus-visible {
      border-color: #22d3ee;
      background: #19365b;
      transform: translateY(-2px);
      outline: none;
    }
    .material strong { display: block; margin-bottom: 7px; font-size: 20px; color: #7dd3fc; }
    .material span { color: #cbd5e1; line-height: 1.6; }
    .path { display: block; margin-top: 10px; color: #94a3b8 !important; font: 12px Consolas, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>🐍 Python研修教材</h1>
    <p class="description">学習する教材を選択してください。基礎編を終えてから応用編へ進むことをおすすめします。</p>
    <div class="materials">
      <a class="material" href="./Python_Space_Quest.html">
        <strong>Python基礎編</strong>
        <span>print、変数、計算、if文、for文、リスト、関数などの基本を学びます。</span>
        <span class="path">Python_Space_Quest.html</span>
      </a>
      <a class="material" href="./Python_Challenge_Lab.html">
        <strong>Python応用編</strong>
        <span>複数の入力テストや、日常・業務を題材にした問題へ挑戦します。</span>
        <span class="path">Python_Challenge_Lab.html</span>
      </a>
    </div>
  </main>
</body>
</html>
