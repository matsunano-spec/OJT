<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python研修教材</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
            color: #eef6ff;
            background:
                radial-gradient(circle at 70% 10%, #1e3a68, #07111f 45%, #020711);
        }

        main {
            width: min(760px, 100%);
            padding: 40px;
            border: 1px solid #294766;
            border-radius: 22px;
            background: rgba(16, 32, 57, 0.96);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        .description {
            margin-bottom: 30px;
            color: #b8c7da;
            line-height: 1.7;
        }

        .教材一覧 {
            display: grid;
            gap: 16px;
        }

        .教材 {
            display: block;
            padding: 22px;
            color: #ffffff;
            text-decoration: none;
            border: 1px solid #315273;
            border-radius: 14px;
            background: #142844;
            transition: 0.2s;
        }

        .教材:hover {
            border-color: #22d3ee;
            background: #19365b;
            transform: translateY(-2px);
        }

        .教材 strong {
            display: block;
            margin-bottom: 7px;
            font-size: 20px;
            color: #7dd3fc;
        }

        .教材 span {
            color: #cbd5e1;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main>
        <h1>🐍 Python研修教材</h1>

        <p class="description">
            学習する教材を選択してください。
            基礎編を終えてから、応用編へ進むことをおすすめします。
        </p>

        <div class="教材一覧">
            ./python_factory_lab_v3.html
                <strong>Python基礎編</strong>
                <span>
                    print、変数、計算、if文、for文、リスト、関数などの基本を学びます。
                </span>
            </a>

            ./python_advanced.html
                <strong>Python応用編</strong>
                <span>
                    複数の入力テストや、日常・業務を題材にした問題へ挑戦します。
                </span>
            </a>
        </div>
    </main>
</body>
</html>
