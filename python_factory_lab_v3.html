<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研修試作v3</title><style>body{font-family:sans-serif;margin:0;background:#f5f7fa}header{background:#1f4b99;color:#fff;padding:12px}main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}.card{background:#fff;border-radius:10px;padding:16px}textarea{width:100%;height:220px}pre,#out{background:#eee;padding:10px;border-radius:6px;white-space:pre-wrap}</style></head><body><header><h2>Python Factory Lab v3</h2></header><main><div class='card'><h3>ステージ</h3><select id='stage'></select><h4>ミッション</h4><div id='mission'></div><h4>お手本</h4><pre id='sample'></pre></div><div class='card'><p>①ステージを選ぶ → ②お手本をコピー → ③実行</p><textarea id='code'></textarea><br><button id='copy'>お手本をコピー</button><button id='run'>実行</button><h4>結果</h4><div id='out'></div></div></main><script>const stages=[{t:'1 Hello World',m:'Hello Worldを表示',s:'print("Hello, World!")'},{t:'2 名前表示',m:'名前を表示',s:'print("松永さん")'},{t:'3 計算',m:'計算結果を表示',s:'print(10+20)'},{t:'4 変数',m:'変数を試す',s:'name="Factory"
print(name)'}];const stage=document.getElementById('stage');const mission=document.getElementById('mission');const sample=document.getElementById('sample');const code=document.getElementById('code');const out=document.getElementById('out');stages.forEach((s,i)=>stage.add(new Option(s.t,i)));function load(){const s=stages[stage.value||0];mission.textContent=s.m;sample.textContent=s.s;code.value=s.s;}stage.addEventListener('change',load);document.getElementById('copy').onclick=()=>code.value=sample.textContent;document.getElementById('run').onclick=()=>{out.textContent='実行機能は次版で実装。現在はステージ表示確認版です。

'+code.value};load();</script></body></html>
