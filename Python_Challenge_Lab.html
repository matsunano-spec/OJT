<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Challenge Lab 160</title><style>
:root{--bg:#07111f;--panel:#102039;--line:#294766;--text:#eef6ff;--muted:#a7b9ce;--cyan:#22d3ee;--green:#22c55e}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Segoe UI,Yu Gothic UI,sans-serif;background:radial-gradient(circle at 75% 8%,#1a3767,#07111f 40%,#020711)}button,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:20px;padding:14px 24px;background:#030a17ee;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0}.top p{margin:3px 0;color:var(--muted);font-size:13px}.progress{width:min(420px,42vw)}.pl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}.track{height:10px;background:#203852;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:.3s}.app{max-width:1650px;margin:auto;padding:16px;display:grid;grid-template-columns:310px minmax(450px,1fr) minmax(430px,.95fr);gap:16px}.panel{background:#102039f5;border:1px solid var(--line);border-radius:18px}.side{padding:14px;max-height:calc(100vh - 100px);overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}select{background:#071426;color:#fff;border:1px solid #3d6388;border-radius:9px;padding:9px}.problem{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:10px;padding:9px;color:#fff;background:transparent;cursor:pointer}.problem:hover{background:#1a3556}.problem.active{background:linear-gradient(90deg,#1d4ed8,#2563eb)}.problem.done .num{background:var(--green)}.num{display:grid;place-items:center;min-width:29px;height:29px;border-radius:50%;background:#2b4666;font-size:12px}.problem small{display:block;color:#b8c7da}.main,.result{padding:21px}.eyebrow{color:var(--cyan);font-size:13px;font-weight:800}.titleRow{display:flex;justify-content:space-between;align-items:center;gap:10px}.main h2{font-size:27px;margin:6px 0}.badge{border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}.easy{background:#14532d;color:#bbf7d0}.medium{background:#78350f;color:#fde68a}.hard{background:#581c87;color:#e9d5ff}.description{line-height:1.7;color:#d5e2f0}.learn{border-left:4px solid var(--cyan);background:#172e50;border-radius:8px;padding:11px;margin:12px 0}.specGrid,.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spec,.compareBox{background:#091729;border:1px solid #2b4b6c;border-radius:10px;padding:12px}.spec h3,.compareBox h4{font-size:12px;color:#94a3b8;margin:0 0 7px}.spec pre,.compareBox pre{margin:0;white-space:pre-wrap;font:14px/1.55 Consolas,monospace}.editorHead{display:flex;justify-content:space-between;margin:16px 0 8px}.editor{width:100%;height:270px;resize:vertical;background:#030914;color:#a5f3fc;border:1px solid #315273;border-radius:11px;padding:14px;font:15px/1.65 Consolas,monospace}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.btn{border:1px solid #3d6388;border-radius:9px;padding:9px 13px;background:#1a3556;color:#fff;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#2563eb,#06b6d4);font-weight:800}.judge{border:0;background:#167447;font-weight:800}.message{margin-top:12px;padding:11px;border-radius:9px;background:#081627}.message.ok{background:#0b3a29;color:#a7f3d0}.message.err{background:#451824;color:#fecdd3}.hint,.answer{display:none;margin-top:10px;padding:12px;border-radius:10px}.hint.show,.answer.show{display:block}.hint{border:1px solid #a16207;background:#342407;color:#fef3c7}.answer{background:#030914;border:1px solid #315273;color:#a5f3fc;white-space:pre-wrap;font:14px/1.6 Consolas,monospace}.resultBox{margin-top:12px;background:#030914;border:1px solid #315273;border-radius:12px;padding:14px;min-height:120px}.console{white-space:pre-wrap;font:15px/1.6 Consolas,monospace;color:#d1fae5}.compare{margin-top:12px}.test{padding:10px;border-bottom:1px solid #263f5c}.pass{color:#86efac}.fail{color:#fda4af}.guide{margin-top:14px;background:#142844;border:1px solid #315273;border-radius:12px;padding:13px;color:#cbd5e1;line-height:1.65}.reviewHeading,.problemHeading{margin:8px 5px;color:#7dd3fc;font-size:13px;font-weight:800}.problemHeading{margin-top:18px}.reviewBtn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:10px;padding:9px;color:#fff;background:transparent;cursor:pointer}.reviewBtn:hover{background:#1a3556}.reviewBtn.active{background:linear-gradient(90deg,#0f766e,#0891b2)}.reviewIcon{display:grid;place-items:center;min-width:29px;height:29px;border-radius:50%;background:#155e75}.reviewBtn small{display:block;color:#bae6fd}.templateBox{margin-top:12px;padding:12px;background:#071426;border:1px solid #315273;border-radius:10px;color:#bae6fd;white-space:pre-wrap;font:14px/1.6 Consolas,monospace}@media(max-width:1120px){.app{grid-template-columns:270px 1fr}.result{grid-column:1/-1}}@media(max-width:760px){.top{display:block}.progress{width:100%;margin-top:10px}.app{display:block}.panel{margin-bottom:14px}.side{max-height:none}.specGrid,.compare{grid-template-columns:1fr}}
.homeBtn{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;border:1px solid #3d6388;border-radius:9px;padding:9px 13px;background:#1a3556;font-weight:700;white-space:nowrap}.homeBtn:hover{background:#244b75;border-color:#67e8f9}.topLeft{display:flex;align-items:center;gap:14px}.topLeft>div{min-width:0}@media(max-width:760px){.topLeft{align-items:flex-start}.homeBtn{margin-top:2px}}</style></head><body><header class="top"><div class="topLeft"><a class="homeBtn" href="./index.html" aria-label="教材選択画面へ戻る">← 教材選択へ</a><div><h1>🐍 Python Challenge Lab</h1><p>160問を段階的に解いて、基礎から業務風問題へ</p></div></div><div class="progress"><div class="pl"><span id="progressText"></span><span id="progressPercent"></span></div><div class="track"><div id="progressFill" class="fill"></div></div></div></header><main class="app"><aside class="panel side"><div class="reviewHeading">📘 問題前の復習</div><div id="reviewList"></div><div class="problemHeading">📝 チャレンジ問題</div><div class="filters"><select id="difficultyFilter"><option value="all">全難易度</option><option value="easy">初級</option><option value="medium">中級</option><option value="hard">上級</option></select><select id="topicFilter"><option value="all">全テーマ</option><option value="if">if文</option><option value="for">for文</option><option value="list">リスト</option><option value="function">関数</option><option value="mix">計算・総合</option><option value="while">while文</option><option value="dict">辞書</option><option value="nested">二重ループ</option><option value="matrix">二次元リスト</option><option value="string">文字列加工</option><option value="tuple">タプル</option><option value="set">集合</option><option value="multi">複数リスト</option></select></div><div id="problemList"></div><button id="resetAll" class="btn" style="width:100%;margin-top:14px">進捗をリセット</button></aside><section class="panel main"><div id="eyebrow" class="eyebrow"></div><div class="titleRow"><h2 id="title"></h2><span id="difficultyBadge" class="badge"></span></div><p id="description" class="description"></p><div id="topicBox" class="learn"></div><div class="specGrid"><div class="spec"><h3>入力例</h3><pre id="inputSpec"></pre></div><div class="spec"><h3>期待する出力</h3><pre id="expectedSpec"></pre></div></div><div class="editorHead"><strong>あなたのコード</strong><span style="font-size:12px;color:#9fb3c8">入力値は採点時に自動設定</span></div><textarea id="editor" class="editor"></textarea><div class="actions"><button id="runBtn" class="btn primary">▶ 実行</button><button id="judgeBtn" class="btn judge">✓ 採点</button><button id="hintBtn" class="btn">💡 ヒント</button><button id="answerBtn" class="btn">答えを見る</button><button id="prevBtn" class="btn">← 前</button><button id="nextBtn" class="btn">次 →</button></div><div id="message" class="message">入力値は書かず、処理だけを書いてください。</div><div id="hintBox" class="hint"></div><pre id="answerBox" class="answer"></pre></section><section class="panel result"><h3>実行・採点結果</h3><div class="resultBox"><div id="console" class="console">実行待ち</div></div><div class="compare"><div class="compareBox"><h4>あなたの出力</h4><pre id="yourOutput">-</pre></div><div class="compareBox"><h4>期待する出力</h4><pre id="expectedOutput">-</pre></div></div><div id="tests"></div><div class="guide"><strong>進め方</strong><br>入力例と期待する出力を読み、処理だけを書きます。採点では複数の入力パターンを自動で確認します。</div></section></main><script>
const problems=[{"id":1,"title":"分から秒へ","d":"easy","topic":"mix","desc":"minutes が表す分数を秒へ変換して表示してください。","learn":"1分は60秒です。掛け算と print() を使います。","tests":[[{"minutes":3},"180"],[{"minutes":7},"420"]],"hint":"minutes に60を掛けて表示します。","answer":"print(minutes * 60)","req":["print\\s*\\(\\s*minutes\\s*\\*\\s*60\\s*\\)"],"kind":"minutesToSeconds","starter":""},{"id":2,"title":"秒から分へ","d":"easy","topic":"mix","desc":"seconds が表す秒数を分へ変換して表示してください。割り切れる入力だけ使います。","learn":"60で割ると分へ変換できます。","tests":[[{"seconds":180},"3"],[{"seconds":480},"8"]],"hint":"seconds を60で割って表示します。","answer":"print(seconds / 60)","req":["print\\s*\\(\\s*seconds\\s*/\\s*60\\s*\\)"],"kind":"secondsToMinutes","starter":""},{"id":3,"title":"時給の計算","d":"easy","topic":"mix","desc":"hourly_wage と hours から給与を計算して表示してください。","learn":"時給 × 働いた時間で給与を求めます。","tests":[[{"hourly_wage":1200,"hours":6},"7200"],[{"hourly_wage":1050,"hours":8},"8400"]],"hint":"2つの変数を掛けます。","answer":"print(hourly_wage * hours)","req":["print\\s*\\(\\s*hourly_wage\\s*\\*\\s*hours\\s*\\)"],"kind":"wage","starter":""},{"id":4,"title":"密度の計算","d":"easy","topic":"mix","desc":"mass と volume から密度を求めて表示してください。","learn":"密度 = 質量 ÷ 体積です。","tests":[[{"mass":120,"volume":30},"4"],[{"mass":90,"volume":15},"6"]],"hint":"mass を volume で割ります。","answer":"print(mass / volume)","req":["print\\s*\\(\\s*mass\\s*/\\s*volume\\s*\\)"],"kind":"density","starter":""},{"id":5,"title":"長方形の面積","d":"easy","topic":"mix","desc":"width と height から長方形の面積を表示してください。","learn":"横 × 縦で面積を求めます。","tests":[[{"width":8,"height":5},"40"],[{"width":12,"height":3},"36"]],"hint":"width と height を掛けます。","answer":"print(width * height)","req":["print\\s*\\(\\s*width\\s*\\*\\s*height\\s*\\)"],"kind":"rectangle","starter":""},{"id":6,"title":"運賃の合計","d":"easy","topic":"mix","desc":"fare は1人分の運賃、people は人数です。合計運賃を表示してください。","learn":"1人分の運賃 × 人数です。","tests":[[{"fare":230,"people":4},"920"],[{"fare":180,"people":3},"540"]],"hint":"fare と people を掛けます。","answer":"print(fare * people)","req":["print\\s*\\(\\s*fare\\s*\\*\\s*people\\s*\\)"],"kind":"fare","starter":""},{"id":7,"title":"商品の合計金額","d":"easy","topic":"mix","desc":"price と count から商品の合計金額を表示してください。","learn":"単価 × 個数です。","tests":[[{"price":350,"count":3},"1050"],[{"price":120,"count":8},"960"]],"hint":"price と count を掛けます。","answer":"print(price * count)","req":["print\\s*\\(\\s*price\\s*\\*\\s*count\\s*\\)"],"kind":"priceCount","starter":""},{"id":8,"title":"おつりの計算","d":"easy","topic":"mix","desc":"payment から price を引き、おつりを表示してください。","learn":"支払額 − 価格です。","tests":[[{"payment":1000,"price":680},"320"],[{"payment":5000,"price":3240},"1760"]],"hint":"payment から price を引きます。","answer":"print(payment - price)","req":["print\\s*\\(\\s*payment\\s*-\\s*price\\s*\\)"],"kind":"change","starter":""},{"id":9,"title":"平均点","d":"easy","topic":"mix","desc":"score1、score2、score3 の平均を表示してください。","learn":"3つを足して3で割ります。","tests":[[{"score1":70,"score2":80,"score3":90},"80"],[{"score1":60,"score2":75,"score3":90},"75"]],"hint":"合計を丸かっこで囲んでから3で割ります。","answer":"print((score1 + score2 + score3) / 3)","req":["print\\s*\\(.*score1.*score2.*score3.*\\/\\s*3\\s*\\)"],"kind":"average3","starter":""},{"id":10,"title":"時間と分を分へ","d":"easy","topic":"mix","desc":"hours と minutes を、合計の分数へ変換して表示してください。","learn":"時間を60倍して、分を足します。","tests":[[{"hours":2,"minutes":30},"150"],[{"hours":1,"minutes":45},"105"]],"hint":"hours * 60 + minutes です。","answer":"print(hours * 60 + minutes)","req":["print\\s*\\(\\s*hours\\s*\\*\\s*60\\s*\\+\\s*minutes\\s*\\)"],"kind":"timeMinutes","starter":""},{"id":11,"title":"日数を時間へ","d":"easy","topic":"mix","desc":"days を時間へ変換して表示してください。","learn":"1日は24時間です。","tests":[[{"days":3},"72"],[{"days":7},"168"]],"hint":"days に24を掛けます。","answer":"print(days * 24)","req":["print\\s*\\(\\s*days\\s*\\*\\s*24\\s*\\)"],"kind":"daysHours","starter":""},{"id":12,"title":"摂氏から華氏へ","d":"easy","topic":"mix","desc":"celsius を華氏へ変換してください。式は celsius * 9 / 5 + 32 です。","learn":"提示された式をそのままPythonで計算します。","tests":[[{"celsius":0},"32"],[{"celsius":25},"77"]],"hint":"celsius * 9 / 5 + 32 を表示します。","answer":"print(celsius * 9 / 5 + 32)","req":["print\\s*\\(.*celsius.*9.*5.*32.*\\)"],"kind":"fahrenheit","starter":""},{"id":13,"title":"割引後の価格","d":"easy","topic":"mix","desc":"price の20%引きの価格を表示してください。","learn":"20%引きは元の価格の80%です。","tests":[[{"price":2000},"1600"],[{"price":4500},"3600"]],"hint":"price * 0.8 で求めます。","answer":"print(price * 0.8)","req":["print\\s*\\(\\s*price\\s*\\*\\s*0\\.8\\s*\\)"],"kind":"discount20","starter":""},{"id":14,"title":"何週間と何日","d":"easy","topic":"mix","desc":"days を weeks週と rest_days日に分け、f文字列で「○週○日」と表示してください。","learn":"// は商、% は余りを求めます。","tests":[[{"days":17},"2週3日"],[{"days":30},"4週2日"]],"hint":"weeks = days // 7、rest_days = days % 7 とします。","answer":"weeks = days // 7\nrest_days = days % 7\nprint(f\"{weeks}週{rest_days}日\")","req":["days\\s*//\\s*7","days\\s*%\\s*7","print\\s*\\(\\s*f?[\"\\']\\{weeks\\}週\\{rest_days\\}日"],"kind":"weeksDays","starter":""},{"id":15,"title":"曜日を進める","d":"easy","topic":"mix","desc":"today は0=月曜、1=火曜、…、6=日曜です。after_days 日後の曜日番号を表示してください。","learn":"7で割った余りを使うと0〜6に戻せます。","tests":[[{"today":0,"after_days":3},"3"],[{"today":5,"after_days":4},"2"]],"hint":"(today + after_days) % 7 です。","answer":"print((today + after_days) % 7)","req":["print\\s*\\(.*today.*after_days.*%\\s*7.*\\)"],"kind":"weekday","starter":""},{"id":16,"title":"合否判定","d":"easy","topic":"if","desc":"score が60以上なら「合格」、それ以外なら「不合格」と表示してください。","learn":"if / else の基本です。","tests":[[{"score":72},"合格"],[{"score":50},"不合格"],[{"score":60},"合格"]],"hint":"score >= 60 を判定し、両方の枝で print() します。","answer":"if score >= 60:\n    print(\"合格\")\nelse:\n    print(\"不合格\")","req":["if\\s+score\\s*>=\\s*60","else\\s*:","print\\s*\\(\\s*[\"\\']合格","print\\s*\\(\\s*[\"\\']不合格"],"kind":"score","starter":""},{"id":17,"title":"偶数・奇数","d":"easy","topic":"if","desc":"number が偶数なら「偶数」、奇数なら「奇数」と表示してください。","learn":"2で割った余りを判定します。","tests":[[{"number":14},"偶数"],[{"number":9},"奇数"]],"hint":"number % 2 == 0 が偶数です。","answer":"if number % 2 == 0:\n    print(\"偶数\")\nelse:\n    print(\"奇数\")","req":["number\\s*%\\s*2\\s*==\\s*0","else\\s*:","偶数","奇数"],"kind":"parity","starter":""},{"id":18,"title":"成人料金の判定","d":"easy","topic":"if","desc":"age が18以上なら「大人」、それ以外なら「子ども」と表示してください。","learn":"比較演算子 >= を使います。","tests":[[{"age":22},"大人"],[{"age":12},"子ども"]],"hint":"age >= 18 を判定します。","answer":"if age >= 18:\n    print(\"大人\")\nelse:\n    print(\"子ども\")","req":["age\\s*>=\\s*18","大人","子ども"],"kind":"adult","starter":""},{"id":19,"title":"送料無料判定","d":"easy","topic":"if","desc":"total が3000以上なら「送料無料」、それ以外なら「送料あり」と表示してください。","learn":"金額の境界をif文で判定します。","tests":[[{"total":4200},"送料無料"],[{"total":2500},"送料あり"],[{"total":3000},"送料無料"]],"hint":"total >= 3000 です。","answer":"if total >= 3000:\n    print(\"送料無料\")\nelse:\n    print(\"送料あり\")","req":["total\\s*>=\\s*3000","送料無料","送料あり"],"kind":"shipping","starter":""},{"id":20,"title":"気温の判定","d":"easy","topic":"if","desc":"temperature が30以上なら「暑い」、それ以外なら「通常」と表示してください。","learn":"数値の大小で表示を切り替えます。","tests":[[{"temperature":33},"暑い"],[{"temperature":25},"通常"]],"hint":"temperature >= 30 を使います。","answer":"if temperature >= 30:\n    print(\"暑い\")\nelse:\n    print(\"通常\")","req":["temperature\\s*>=\\s*30","暑い","通常"],"kind":"temperature","starter":""},{"id":21,"title":"3段階の成績","d":"easy","topic":"if","desc":"score が80以上ならA、60以上ならB、それ以外ならCと表示してください。","learn":"if、elif、else を使います。","tests":[[{"score":90},"A"],[{"score":70},"B"],[{"score":40},"C"]],"hint":"高い条件の80以上から判定します。","answer":"if score >= 80:\n    print(\"A\")\nelif score >= 60:\n    print(\"B\")\nelse:\n    print(\"C\")","req":["if\\s+score\\s*>=\\s*80","elif\\s+score\\s*>=\\s*60","else\\s*:"],"kind":"gradeABC","starter":""},{"id":22,"title":"範囲内か判定","d":"easy","topic":"if","desc":"number が10以上20以下なら「範囲内」、それ以外なら「範囲外」と表示してください。","learn":"and で2つの条件をつなぎます。","tests":[[{"number":15},"範囲内"],[{"number":25},"範囲外"],[{"number":10},"範囲内"]],"hint":"number >= 10 and number <= 20 です。","answer":"if number >= 10 and number <= 20:\n    print(\"範囲内\")\nelse:\n    print(\"範囲外\")","req":["number\\s*>=\\s*10\\s+and\\s+number\\s*<=\\s*20","範囲内","範囲外"],"kind":"inRange","starter":""},{"id":23,"title":"1から5まで","d":"easy","topic":"for","desc":"1から5までを1行ずつ表示してください。","learn":"range(1, 6) を使います。","tests":[[{},"1\n2\n3\n4\n5"]],"hint":"for文の中で i を表示します。","answer":"for i in range(1, 6):\n    print(i)","req":["for\\s+i\\s+in\\s+range\\s*\\(\\s*1\\s*,\\s*6\\s*\\)","print\\s*\\(\\s*i\\s*\\)"],"kind":"range15","starter":""},{"id":24,"title":"文字を繰り返す","d":"easy","topic":"for","desc":"word を count 回、1行ずつ表示してください。","learn":"range(count) で入力された回数だけ繰り返します。","tests":[[{"word":"Hi","count":3},"Hi\nHi\nHi"],[{"word":"Go","count":2},"Go\nGo"]],"hint":"range(count) の中で print(word) です。","answer":"for i in range(count):\n    print(word)","req":["range\\s*\\(\\s*count\\s*\\)","print\\s*\\(\\s*word\\s*\\)"],"kind":"repeatWord","starter":""},{"id":25,"title":"カウントダウン","d":"easy","topic":"for","desc":"start から1まで1行ずつカウントダウンしてください。","learn":"range(start, 0, -1) を使います。","tests":[[{"start":5},"5\n4\n3\n2\n1"],[{"start":3},"3\n2\n1"]],"hint":"増減値に -1 を指定します。","answer":"for i in range(start, 0, -1):\n    print(i)","req":["range\\s*\\(\\s*start\\s*,\\s*0\\s*,\\s*-1\\s*\\)","print\\s*\\(\\s*i\\s*\\)"],"kind":"countdown","starter":""},{"id":26,"title":"1からnの合計","d":"easy","topic":"for","desc":"1から n までの合計を表示してください。","learn":"totalを0から始めて繰り返し加算します。","tests":[[{"n":10},"55"],[{"n":5},"15"]],"hint":"range(1, n + 1) を使います。","answer":"total = 0\nfor i in range(1, n + 1):\n    total = total + i\nprint(total)","req":["total\\s*=\\s*0","range\\s*\\(\\s*1\\s*,\\s*n\\s*\\+\\s*1\\s*\\)","total\\s*=\\s*total\\s*\\+\\s*i","print\\s*\\(\\s*total\\s*\\)"],"kind":"sumN","starter":""},{"id":27,"title":"nの倍数","d":"easy","topic":"for","desc":"1から20までのうち、n の倍数だけを表示してください。","learn":"for文とif文を組み合わせます。","tests":[[{"n":4},"4\n8\n12\n16\n20"],[{"n":5},"5\n10\n15\n20"]],"hint":"i % n == 0 のとき表示します。","answer":"for i in range(1, 21):\n    if i % n == 0: function go(i){saveCurrent();viewMode='problem';cur=i;persist();render()}function normalize(x){return String(x).replace(/\r/g,'').trim()}
function cleanCode(code){return code.replace(/#.*$/gm,'').trim()}
function structureOK(code,p){
  const c=cleanCode(code);
  if(!c)return false;
  if(['addFunction','scoreFunction','sumFunction'].includes(p.kind))return /\bdef\b/.test(c)&&/\breturn\b/.test(c);
  if(['score','parity','adult','shipping','temperature','gradeABC','inRange','overtime','passwordLength','average','scoreList'].includes(p.kind))return /\bif\b/.test(c)&&/\bprint\s*\(/.test(c);
  if(['range15','repeatWord','countdown','sumN','multiplesN','stairsN','emailFilter','rainTotal','rainDays','lowStock','passingScores','findMax','findMin','charCount','average','scoreList','fizzbuzzN','overtimeDays','targetDay'].includes(p.kind))return /\bfor\b/.test(c)&&/\bprint\s*\(/.test(c);
  return /\bprint\s*\(/.test(c);
}
function quotedPrints(code){return [...code.matchAll(/print\s*\(\s*["']([^"']*)["']\s*\)/g)].map(m=>m[1])}
function staticPrintedOutput(code){
  const lines=[];let m,re=/print\s*\(\s*(?:["']([^"']*)["']|(-?\d+(?:\.\d+)?)|(True|False))\s*\)/g;
  while((m=re.exec(code))!==null)lines.push(m[1]!==undefined?m[1]:m[2]!==undefined?m[2]:m[3]);
  return lines.length?lines.join('\n'):null;
}
function evaluateConditional(code,p,test){
  const prints=quotedPrints(code),v=test.vars;if(prints.length<2)return null;let condition;
  switch(p.kind){case'score':condition=v.score>=60;break;case'parity':condition=v.number%2===0;break;case'adult':condition=v.age>=18;break;case'shipping':condition=v.total>=3000;break;case'temperature':condition=v.temperature>=30;break;case'inRange':condition=v.number>=10&&v.number<=20;break;case'overtime':condition=v.work_hours>8;break;case'passwordLength':condition=v.password.length>=8;break;case'gradeABC':return v.score>=80?prints[0]:v.score>=60?prints[1]:prints[prints.length-1];default:return null}
  return condition?prints[0]:prints[prints.length-1];
}
function parseRange(code,test){
  const m=code.match(/range\s*\(\s*([^,()]+)(?:\s*,\s*([^,()]+))?(?:\s*,\s*([^,()]+))?\s*\)/);if(!m)return null;
  const val=x=>{x=x.trim();if(/^\d+$/.test(x))return Number(x);if(x==='n')return Number(test.vars.n);if(x==='n + 1'||x==='n+1')return Number(test.vars.n)+1;if(x==='count')return Number(test.vars.count);if(x==='start')return Number(test.vars.start);if(x==='height + 1'||x==='height+1')return Number(test.vars.height)+1;return NaN};
  let a,b,step;if(m[2]===undefined){a=0;b=val(m[1]);step=1}else{a=val(m[1]);b=val(m[2]);step=m[3]===undefined?1:val(m[3])}if([a,b,step].some(Number.isNaN)||step===0)return null;
  const out=[];for(let i=a;step>0?i<b:i>b;i+=step)out.push(i);return out;
}
function evaluateLoop(code,p,test){
  const nums=parseRange(code,test),v=test.vars;if(!nums)return null;
  switch(p.kind){
    case'range15':return nums.join('\n');
    case'repeatWord':return nums.map(()=>v.word).join('\n');
    case'countdown':return nums.join('\n');
    case'stairsN':return nums.map(i=>'#'.repeat(i)).join('\n');
    case'multiplesN':return nums.filter(i=>i%v.n===0).join('\n');
    case'sumN':return String(nums.reduce((a,b)=>a+b,0));
    case'fizzbuzzN':return nums.map(i=>i%15===0?'FizzBuzz':i%3===0?'Fizz':i%5===0?'Buzz':String(i)).join('\n');
    default:return null;
